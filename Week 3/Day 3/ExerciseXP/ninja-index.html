<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3 Ninja Exercises</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }

      .box {
        max-width: 500px;
        margin-bottom: 40px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      #totalTip {
        display: none;
        margin-top: 15px;
        padding: 10px;
        background: #f3f3f3;
      }

      button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Exercise 1: Calculate the tip</h2>
      <label for="billAmt">Bill Amount:</label>
      <input type="number" id="billAmt" /><br /><br />

      <label for="serviceQual">Service Quality:</label>
      <input type="number" id="serviceQual" step="0.1" min="0" max="1" /><br /><br />

      <label for="numOfPeople">Number of People:</label>
      <input type="number" id="numOfPeople" min="1" /><br /><br />

      <button id="calculate" type="button" onclick="calculateTip()">Calculate Tip</button>

      <div id="totalTip">
        <p>Tip per person: <span id="tip"></span></p>
      </div>
    </div>

    <div class="box">
      <h2>Exercise 2: Validate the email</h2>
      <form id="emailForm" novalidate>
        <label for="emailInput">Email:</label>
        <input type="email" id="emailInput" name="email" />
        <button type="submit">Submit</button>
      </form>
      <p id="emailResult"></p>
    </div>

    <div class="box">
      <h2>Exercise 3: Get the user's geolocation</h2>
      <button id="geoButton" type="button">Get My Coordinates</button>
      <p id="geoResult"></p>
    </div>

    <script src="Exercise XP Ninja.js"></script>
  </body>
</html>
