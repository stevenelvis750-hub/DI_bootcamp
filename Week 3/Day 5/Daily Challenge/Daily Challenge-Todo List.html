<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Tasks | To Do List</title>

    <link rel="stylesheet" href="Daily Challenge-Todo List.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="todo-app">

        <!-- HEADER -->

        <header class="app-header">

            <div>

                <p class="eyebrow">
                    ✦ DAILY PRODUCTIVITY
                </p>

                <h1>
                    My <span>Tasks</span>
                </h1>

                <p id="date">
                    Today
                </p>

            </div>

            <div class="progress-circle">

                <span id="progressNumber">
                    0%
                </span>

                <small>
                    DONE
                </small>

            </div>

        </header>


        <!-- ADD TASK -->

        <form id="taskForm" class="task-form">

            <label
                class="sr-only"
                for="taskInput">
                New task
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-plus"></i>

                <input
                    id="taskInput"
                    name="task"
                    type="text"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="100"
                    required
                >

            </div>

            <button type="submit">
                Add Task
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>


        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="searchInput"
                type="text"
                placeholder="Search your tasks..."
            >

        </div>


        <!-- FILTERS -->

        <div class="task-controls">

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter"
                    data-filter="completed">
                    Completed
                </button>

            </div>

            <button
                id="clearCompleted"
                class="clear-completed">

                Clear completed

            </button>

        </div>


        <!-- TASK LIST -->

        <section
            class="tasks-container"
            aria-label="Task list">

            <div
                id="taskList"
                class="listTasks">
            </div>


            <!-- EMPTY STATE -->

            <div
                id="emptyState"
                class="empty-state">

                <div class="empty-icon">
                    ✨
                </div>

                <h2>
                    Your day is clear!
                </h2>

                <p>
                    Add a task above and let's get things done.
                </p>

            </div>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>
                <i class="fa-solid fa-check"></i>
                <strong id="remaining">
                    0
                </strong>
                tasks remaining
            </span>

            <span>
                Built with ✦
            </span>

        </footer>

    </main>


    <script src="Daily Challenge-Todo List.js"></script>

</body>

</html>
