<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sunrise Times</title>
</head>
<body>
	<h1>Sunrise Times</h1>
	<form id="sunrise-form">
		<fieldset>
			<legend>First city</legend>
			<label for="city-1-latitude">Latitude</label>
			<input id="city-1-latitude" type="number" step="any" value="48.864716" required>
			<label for="city-1-longitude">Longitude</label>
			<input id="city-1-longitude" type="number" step="any" value="2.349014" required>
		</fieldset>
		<fieldset>
			<legend>Second city</legend>
			<label for="city-2-latitude">Latitude</label>
			<input id="city-2-latitude" type="number" step="any" value="40.730610" required>
			<label for="city-2-longitude">Longitude</label>
			<input id="city-2-longitude" type="number" step="any" value="-73.935242" required>
		</fieldset>
		<button type="submit">Find sunrise times</button>
	</form>
	<section id="results" aria-live="polite">Submit the form to find both sunrise times.</section>
	<script src="Daily Challenge-Promise.all().js"></script>
</body>
</html>
